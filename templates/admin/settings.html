{% extends "admin/base_admin.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h1>Settings</h1>
<form method="POST" class="admin-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
        <label for="juice_price">Juice Price (PKR)</label>
        <input type="number" id="juice_price" name="juice_price" value="{{ price.value if price else '50' }}" step="0.01" required>
    </div>
    <div class="form-group">
        <label for="whatsapp_number">WhatsApp Number</label>
        <input type="text" id="whatsapp_number" name="whatsapp_number" value="{{ whatsapp.value if whatsapp else '923452202037' }}" required placeholder="e.g. 923452202037">
        <p class="form-note">Include country code without + or leading zero. Example: 923452202037</p>
    </div>
    <button type="submit" class="btn btn-primary">Save Settings</button>
</form>
{% endblock %}
