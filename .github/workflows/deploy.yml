name: Deploy

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install flake8 pycodestyle pyflakes
      - run: pip install -r requirements.txt
      - run: flake8 app/ --max-line-length=120 --exclude=__pycache__,venv

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --upgrade pip setuptools wheel
      - run: pip install -r requirements.txt
      - run: pip install pytest
      - run: python -m pytest tests/ -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via Docker
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "No SSH_PRIVATE_KEY secret set. Skipping deploy."
            exit 0
          fi
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem $SERVER_USER@$SERVER_HOST "
            cd /opt/juicynext &&
            git pull origin main &&
            docker compose down &&
            docker compose build --no-cache web &&
            docker compose up -d
          "
